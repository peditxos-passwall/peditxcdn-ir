backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "تنظیمات سایت"
    folder: "src/content/settings"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "عنوان"
        name: "title"
        widget: "string"
      - label: "توضیحات"
        name: "description"
        widget: "text"
      - label: "لوگو"
        name: "logo"
        widget: "image"
        required: false

  - name: "hero"
    label: "بخش اصلی (Hero)"
    folder: "src/content/hero"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "عنوان اصلی"
        name: "title"
        widget: "string"
      - label: "زیرعنوان"
        name: "subtitle"
        widget: "text"
      - label: "متن دکمه نصب"
        name: "install_btn"
        widget: "string"
      - label: "متن دکمه کامپایل"
        name: "compile_btn"
        widget: "string"
      - label: "متن دکمه استور"
        name: "store_btn"
        widget: "string"

  - name: "features"
    label: "ویژگی‌ها"
    folder: "src/content/features"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "عنوان"
        name: "title"
        widget: "string"
      - label: "توضیحات"
        name: "description"
        widget: "text"
      - label: "آیکون"
        name: "icon"
        widget: "string"
        hint: "نام آیکون Font Awesome مثلا: fa-rocket"

  - name: "services"
    label: "سرویس‌ها"
    folder: "src/content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "عنوان"
        name: "title"
        widget: "string"
      - label: "توضیحات"
        name: "description"
        widget: "text"
      - label: "لینک"
        name: "link"
        widget: "string"
      - label: "متن دکمه"
        name: "button_text"
        widget: "string"
      - label: "رنگ"
        name: "color"
        widget: "select"
        options:
          - { label: "آبی", value: "primary" }
          - { label: "بنفش", value: "secondary" }
          - { label: "سبز", value: "success" }

  - name: "install"
    label: "بخش نصب"
    folder: "src/content/install"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "عنوان"
        name: "title"
        widget: "string"
      - label: "توضیحات"
        name: "description"
        widget: "text"
      - label: "لینک پنل نصب"
        name: "install_link"
        widget: "string"
      - label: "متن دکمه"
        name: "button_text"
        widget: "string"
      - label: "متن امنیتی"
        name: "secure_note"
        widget: "string"

  - name: "footer"
    label: "فوتر"
    folder: "src/content/footer"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "لینک تلگرام"
        name: "telegram_link"
        widget: "string"
      - label: "لینک گیت‌هاب"
        name: "github_link"
        widget: "string"
      - label: "متن کپی‌رایت"
        name: "copyright"
        widget: "string"
